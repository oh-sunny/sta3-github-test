<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Tetris</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:14px system-ui}.game{text-align:center}h1{margin:0 0 8px;font-size:20px}canvas{display:block;border:2px solid #777;background:#000}p{margin:8px 0}button{padding:7px 16px;border:0;border-radius:5px;font-weight:700;cursor:pointer}
</style>
<main class="game">
  <h1>Mini Tetris</h1>
  <canvas id="board" width="200" height="400"></canvas>
  <p>점수: <b id="score">0</b></p>
  <button id="restart">다시 시작</button>
  <p>← → 이동 · ↑ 회전 · ↓ 내리기 · Space 즉시 내리기</p>
</main>
<script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score');
const W=10,H=20,S=20,colors=['','#00d9ff','#ffd500','#b05cff','#42d66b','#ff5555','#4f7cff','#ff9d35'];
const pieces=[
  [[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]
];
let board,piece,x,y,score,last,over;
function copy(m){return m.map(r=>[...r])}
function reset(){board=Array.from({length:H},()=>Array(W).fill(0));score=0;scoreEl.textContent=0;over=false;spawn();last=performance.now()}
function spawn(){piece=copy(pieces[Math.floor(Math.random()*pieces.length)]);x=Math.floor((W-piece[0].length)/2);y=0;if(hit(piece,x,y))over=true}
function hit(m,nx,ny){return m.some((r,py)=>r.some((v,px)=>v&&(nx+px<0||nx+px>=W||ny+py>=H||ny+py>=0&&board[ny+py][nx+px]))) }
function merge(){piece.forEach((r,py)=>r.forEach((v,px)=>{if(v)board[y+py][x+px]=v}))}
function clearLines(){let n=0;for(let row=H-1;row>=0;row--){if(board[row].every(Boolean)){board.splice(row,1);board.unshift(Array(W).fill(0));n++;row++}}if(n){score+=[0,100,300,500,800][n];scoreEl.textContent=score}}
function drop(){if(!hit(piece,x,y+1))y++;else{merge();clearLines();spawn()}}
function rotate(){const r=piece[0].map((_,i)=>piece.map(row=>row[i]).reverse());for(const dx of [0,-1,1,-2,2])if(!hit(r,x+dx,y)){piece=r;x+=dx;break}}
function hardDrop(){while(!hit(piece,x,y+1))y++;drop()}
function drawCell(v,px,py){ctx.fillStyle=colors[v];ctx.fillRect(px*S,py*S,S-1,S-1)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);board.forEach((r,py)=>r.forEach((v,px)=>v&&drawCell(v,px,py)));piece.forEach((r,py)=>r.forEach((v,px)=>v&&drawCell(v,x+px,y+py)));if(over){ctx.fillStyle='#000b';ctx.fillRect(0,165,200,70);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillText('게임 종료',100,195);ctx.font='13px system-ui';ctx.fillText('다시 시작을 눌러주세요',100,218)}}
function loop(now){if(!over&&now-last>500){drop();last=now}draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(over)return;if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'&&!hit(piece,x-1,y))x--;if(e.key==='ArrowRight'&&!hit(piece,x+1,y))x++;if(e.key==='ArrowDown')drop();if(e.key==='ArrowUp')rotate();if(e.key===' ')hardDrop();draw()});
document.querySelector('#restart').onclick=reset;reset();requestAnimationFrame(loop);
</script>
</html>
